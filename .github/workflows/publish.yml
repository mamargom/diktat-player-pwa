name: Publicar Diktat Player multibranch

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Detectar cambio de feature
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-multibranch
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          path: sources/main

      - name: Descargar feature OCR
        uses: actions/checkout@v4
        with:
          ref: feature/ocr
          path: sources/ocr

      - name: Descargar feature local-package
        uses: actions/checkout@v4
        with:
          ref: feature/local-package
          path: sources/local-package

      - name: Verificar versiones
        run: |
          test -f sources/main/index.html
          test -f sources/main/service-worker.js
          test -f sources/ocr/index.html
          test -f sources/ocr/service-worker.js
          test -f sources/local-package/index.html
          grep -q "Main · Versión" sources/main/index.html
          grep -q "Feature OCR" sources/ocr/index.html
          grep -q "Feature Local Package" sources/local-package/index.html

      - name: Preparar publicación
        run: |
          mkdir -p site/features/ocr site/features/local-package
          rsync -a --exclude='.git' --exclude='.github' sources/main/ site/
          rsync -a --exclude='.git' --exclude='.github' sources/ocr/ site/features/ocr/
          rsync -a --exclude='.git' --exclude='.github' sources/local-package/ site/features/local-package/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
