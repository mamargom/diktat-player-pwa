name: Publicar prueba de puntuación hablada v45.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar feature de puntuación hablada
        uses: actions/checkout@v4
        with:
          ref: feature/spoken-punctuation-v45

      - name: Verificar feature de puntuación hablada
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f assets/piper_phonemize.wasm
          test -f assets/whisper/ort-wasm-simd-threaded.asyncify.wasm
          grep -q "Feature puntuación hablada · Versión 45.2" index.html
          if grep -q "chatgpt.site" index.html service-worker.js manifest.webmanifest; then
            echo "La aplicación principal todavía depende de Sites"
            exit 1
          fi

      - name: Preparar publicación de prueba
        run: |
          mkdir site
          cp -a .nojekyll index.html manifest.webmanifest service-worker.js robots.txt favicon.ico site/
          cp -a icon-180.png icon-192.png icon-512.png icon-maskable-512.png icon.svg site/
          cp -a assets stable-v19 stable-v22 stable-v27 stable-v28 stable-v29 site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
