name: Detectar cambio de feature

on:
  push:
    branches:
      - feature/ocr
      - feature/local-package

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar feature
        uses: actions/checkout@v4

      - name: Validar archivos web
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
